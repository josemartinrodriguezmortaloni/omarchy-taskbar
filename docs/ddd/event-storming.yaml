  - { id: HS-01, question: Does a preview capture a window minimized to special:minimized?, about: [EV-05], status: resolved, resolution: "Yes. Prototype on 2026-11-06 (Quickshell 0.3.2, ScreencopyView on the Wayland toplevel): first frame after 190 ms at full size, and frames keep updating while the window stays minimized." }
